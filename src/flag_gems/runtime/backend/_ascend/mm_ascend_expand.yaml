mm_ascend:
  # Compact output tiles.
  - config:
    include_default_configs: false
    param_map: &mm_params
      META: {BLOCK_M: block_m, BLOCK_N: block_n, BLOCK_K: block_k, SPLIT_K: split_k}
      num_stages: stages
      num_warps: warps
    block_m: [16, 32]
    block_n: [32, 64]
    block_k: [32, 64, 128]
    split_k: &single_k [1]
    stages: &mm_stages [1, 2, 3]
    warps: &mm_warps [4]

  # Short M, wider rows.
  - config:
    param_map: *mm_params
    block_m: [16, 32]
    block_n: [128]
    block_k: [64, 128, 256]
    split_k: *single_k
    stages: *mm_stages
    warps: *mm_warps

  # Narrow N, taller tiles.
  - config:
    param_map: *mm_params
    block_m: [64, 128]
    block_n: [32]
    block_k: [64, 128, 256]
    split_k: *single_k
    stages: *mm_stages
    warps: *mm_warps

  # General rectangular and square tiles.
  - config:
    param_map: *mm_params
    block_m: [64, 128]
    block_n: [64, 128]
    block_k: [64, 128, 256]
    split_k: *single_k
    stages: *mm_stages
    warps: *mm_warps

  # Large aligned, wide orientation.
  - config:
    param_map: *mm_params
    block_m: [128]
    block_n: [256]
    block_k: [128, 256]
    split_k: *single_k
    stages: *mm_stages
    warps: *mm_warps

  # Large aligned, tall orientation.
  - config:
    param_map: *mm_params
    block_m: [256]
    block_n: [128]
    block_k: [128, 256]
    split_k: *single_k
    stages: *mm_stages
    warps: *mm_warps

  # Long K, compact output tile.
  - config:
    param_map: *mm_params
    block_m: [16]
    block_n: [64]
    block_k: [512, 1024]
    split_k: *single_k
    stages: *mm_stages
    warps: *mm_warps

  # Larger K, rectangular and square output tiles.
  - config:
    param_map: *mm_params
    block_m: [64, 128]
    block_n: [128]
    block_k: [512]
    split_k: *single_k
    stages: *mm_stages
    warps: *mm_warps

  - strategy: {M: default, N: default, K: default}

mm_narrow_gemv_ascend:
  - config:
    param_map: &gemm_out_k
      META: {BLOCK_OUT: block_out, BLOCK_K: block_k}
      num_stages: stages
      num_warps: warps
    block_out: [1, 2, 4]
    block_k: [128, 256, 512, 1024, 2048]
    stages: &gemm_one_stage [1]
    warps: &gemm_warps [4]
  - config:
    param_map: *gemm_out_k
    block_out: [8]
    block_k: [128, 256, 512, 1024]
    stages: *gemm_one_stage
    warps: *gemm_warps
  - config:
    param_map: *gemm_out_k
    block_out: [16]
    block_k: [128, 256, 512]
    stages: *gemm_one_stage
    warps: *gemm_warps

nt_split_ascend:
  - config:
    param_map:
      META: {BLOCK_M: block_m, BLOCK_N: block_n, BLOCK_K: block_k, SPLITS: splits}
      num_stages: stages
      num_warps: warps
    block_m: [16, 32, 64]
    block_n: [32, 64, 128]
    block_k: [128, 256]
    splits: [2, 4, 8]
    stages: [2]
    warps: [32]

mm_rectangular_ascend:
  - config:
    param_map:
      META: {BLOCK_M: block_m, BLOCK_N: block_n, BLOCK_K: block_k}
      num_stages: stages
      num_warps: warps
    block_m: [16, 32, 64, 128]
    block_n: [32, 64, 128, 256]
    block_k: [64, 128, 256]
    stages: &gemm_cube_stages [1, 2]
    warps: *gemm_warps

mm_packed_narrow_ascend:
  - config:
    param_map: &gemm_bm_bk
      META: {BM: bm, BK: bk}
      num_stages: stages
      num_warps: warps
    bm: [16, 32, 64]
    bk: [128, 256, 512, 1024]
    stages: *gemm_cube_stages
    warps: *gemm_warps
  - config:
    param_map: *gemm_bm_bk
    bm: [128]
    bk: [128, 256]
    stages: *gemm_cube_stages
    warps: *gemm_warps

panel_gemm_ascend:
  - config:
    param_map: *gemm_bm_bk
    bm: [16, 32, 64, 128]
    bk: [64, 128, 256]
    stages: *gemm_cube_stages
    warps: *gemm_warps

tiled_gemm_ascend:
  - config:
    param_map: &tiled_params
      META: {BM: bm, BN: bn, BK: bk}
      num_stages: stages
      num_warps: warps
    bm: [16, 32]
    bn: [16, 32, 64]
    bk: [64, 128, 256]
    stages: &tiled_stages [1, 2]
    warps: &tiled_warps [4]
  - config:
    param_map: *tiled_params
    bm: [64]
    bn: [32, 64]
    bk: [64, 128, 256]
    stages: *tiled_stages
    warps: *tiled_warps
  - config:
    param_map: *tiled_params
    bm: [16, 32, 64]
    bn: [64, 128]
    bk: [256, 512]
    stages: *tiled_stages
    warps: *tiled_warps
  - config:
    param_map: *tiled_params
    bm: [128]
    bn: [128, 256]
    bk: [128, 256]
    stages: *tiled_stages
    warps: *tiled_warps
  - config:
    param_map: *tiled_params
    bm: [32, 64]
    bn: [256]
    bk: [128, 256]
    stages: *tiled_stages
    warps: *tiled_warps
  - config:
    param_map: *tiled_params
    bm: [256]
    bn: [128]
    bk: [256]
    stages: *tiled_stages
    warps: *tiled_warps
  - config:
    param_map: *tiled_params
    bm: [16]
    bn: [512]
    bk: [128]
    stages: *tiled_stages
    warps: *tiled_warps
