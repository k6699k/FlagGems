bmm_ascend:
  # Compact output and batch parallelism.
  - config:
    include_default_configs: true
    param_map: &tile_params
      META: {TILE_M: tile_m, TILE_N: tile_n, TILE_K: tile_k, GROUP_M: group_m}
      num_stages: stages
      num_warps: warps
    tile_m: [16, 32]
    tile_n: [32, 64]
    tile_k: [32, 64, 128, 256]
    group_m: [1]
    stages: &stages [1, 2, 3]
    warps: &warps [4]

  # General tiles and output ordering.
  - config:
    param_map: *tile_params
    tile_m: [32, 64, 128]
    tile_n: [32, 64, 128]
    tile_k: [32, 64, 128, 256]
    group_m: [1, 4, 8]
    stages: *stages
    warps: *warps

  # Wider output tiles.
  - config:
    param_map: *tile_params
    tile_m: [32, 64, 128]
    tile_n: [256]
    tile_k: [64, 128, 256]
    group_m: [1, 4, 8]
    stages: *stages
    warps: *warps

  # Taller output tiles.
  - config:
    param_map: *tile_params
    tile_m: [256]
    tile_n: [32, 64, 128]
    tile_k: [64, 128, 256]
    group_m: [1, 4, 8]
    stages: *stages
    warps: *warps

  # Thin tiles spanning a large output dimension.
  - config:
    param_map: *tile_params
    tile_m: [64]
    tile_n: [512]
    tile_k: [64, 128]
    group_m: [1]
    stages: *stages
    warps: *warps

  # Tall tiles spanning a small output width.
  - config:
    param_map: *tile_params
    tile_m: [512]
    tile_n: [32, 64]
    tile_k: [64, 128]
    group_m: [1]
    stages: *stages
    warps: *warps

  # Long K with compact output.
  - config:
    param_map: *tile_params
    tile_m: [16, 32]
    tile_n: [64]
    tile_k: [512, 1024]
    group_m: [1]
    stages: *stages
    warps: *warps

  # Long K with regular output.
  - config:
    param_map: *tile_params
    tile_m: [64, 128]
    tile_n: [128]
    tile_k: [512]
    group_m: [1]
    stages: *stages
    warps: *warps

  # Two-row-group ordering.
  - config:
    param_map: *tile_params
    tile_m: [32]
    tile_n: [64]
    tile_k: [256]
    group_m: [2]
    stages: *stages
    warps: *warps

  - strategy:
      M: default
      N: default
      K: default
      BATCH: default
      DOT_PAD_ONLY_K: default

narrow_gemv_ascend:
  - config:
    param_map: &gemm_bm_bk
      META: {BM: bm, BK: bk}
      num_stages: stages
      num_warps: warps
    bm: [1, 2, 4, 8]
    bk: [64, 128, 256, 512, 1024]
    stages: &gemm_one_stage [1]
    warps: &gemm_warps [4]

column_gemv_ascend:
  - config:
    param_map: *gemm_bm_bk
    bm: [1, 2, 4, 8, 16]
    bk: [128, 256, 512, 1024, 2048]
    stages: *gemm_one_stage
    warps: *gemm_warps
  - config:
    param_map: *gemm_bm_bk
    bm: [32]
    bk: [128, 256, 512]
    stages: *gemm_one_stage
    warps: *gemm_warps

tiled_gemm_ascend:
  - config:
    param_map: &tiled_params
      META: {BM: bm, BN: bn, BK: bk}
      num_stages: stages
      num_warps: warps
    bm: [16, 32]
    bn: [16, 32, 64]
    bk: [64, 128, 256]
    stages: &tiled_stages [1, 2]
    warps: &tiled_warps [4]
  - config:
    param_map: *tiled_params
    bm: [64]
    bn: [32, 64]
    bk: [64, 128, 256]
    stages: *tiled_stages
    warps: *tiled_warps
  - config:
    param_map: *tiled_params
    bm: [16, 32, 64]
    bn: [64, 128]
    bk: [256, 512]
    stages: *tiled_stages
    warps: *tiled_warps
  - config:
    param_map: *tiled_params
    bm: [128]
    bn: [128, 256]
    bk: [128, 256]
    stages: *tiled_stages
    warps: *tiled_warps
  - config:
    param_map: *tiled_params
    bm: [32, 64]
    bn: [256]
    bk: [128, 256]
    stages: *tiled_stages
    warps: *tiled_warps
  - config:
    param_map: *tiled_params
    bm: [256]
    bn: [128]
    bk: [256]
    stages: *tiled_stages
    warps: *tiled_warps
  - config:
    param_map: *tiled_params
    bm: [16]
    bn: [512]
    bk: [128]
    stages: *tiled_stages
    warps: *tiled_warps
