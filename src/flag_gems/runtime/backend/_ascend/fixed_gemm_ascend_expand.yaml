narrow_gemv_ascend:
  - config:
    param_map: &bm_bk
      META: {BM: bm, BK: bk}
      num_stages: stages
      num_warps: warps
    bm: [1, 2, 4, 8]
    bk: [64, 128, 256, 512, 1024]
    stages: &one_stage [1]
    warps: &warps [4]

column_gemv_ascend:
  - config:
    param_map: *bm_bk
    bm: [1, 2, 4, 8, 16]
    bk: [128, 256, 512, 1024, 2048]
    stages: *one_stage
    warps: *warps
  - config:
    param_map: *bm_bk
    bm: [32]
    bk: [128, 256, 512]
    stages: *one_stage
    warps: *warps

mm_narrow_gemv_ascend:
  - config:
    param_map: &out_k
      META: {BLOCK_OUT: block_out, BLOCK_K: block_k}
      num_stages: stages
      num_warps: warps
    block_out: [1, 2, 4]
    block_k: [128, 256, 512, 1024, 2048]
    stages: *one_stage
    warps: *warps
  - config:
    param_map: *out_k
    block_out: [8]
    block_k: [128, 256, 512, 1024]
    stages: *one_stage
    warps: *warps
  - config:
    param_map: *out_k
    block_out: [16]
    block_k: [128, 256, 512]
    stages: *one_stage
    warps: *warps

mm_rectangular_ascend:
  - config:
    param_map:
      META: {BLOCK_M: block_m, BLOCK_N: block_n, BLOCK_K: block_k}
      num_stages: stages
      num_warps: warps
    block_m: [16, 32, 64, 128]
    block_n: [32, 64, 128, 256]
    block_k: [64, 128, 256]
    stages: &cube_stages [1, 2]
    warps: *warps

mm_packed_narrow_ascend:
  - config:
    param_map: *bm_bk
    bm: [16, 32, 64]
    bk: [128, 256, 512, 1024]
    stages: *cube_stages
    warps: *warps
  - config:
    param_map: *bm_bk
    bm: [128]
    bk: [128, 256]
    stages: *cube_stages
    warps: *warps

panel_gemm_ascend:
  - config:
    param_map: *bm_bk
    bm: [16, 32, 64, 128]
    bk: [64, 128, 256]
    stages: *cube_stages
    warps: *warps
