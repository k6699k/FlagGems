baddbmm_ascend:
  # Compact output and batch parallelism.
  - config:
    include_default_configs: true
    param_map: &tile_params
      META: {TILE_M: tile_m, TILE_N: tile_n, TILE_K: tile_k, GROUP_M: group_m}
      num_stages: stages
      num_warps: warps
    tile_m: [16, 32]
    tile_n: [32, 64]
    tile_k: [32, 64, 128, 256]
    group_m: [1]
    stages: &stages [1, 2, 3]
    warps: &warps [4]

  # General tiles and output ordering.
  - config:
    param_map: *tile_params
    tile_m: [32, 64, 128]
    tile_n: [32, 64, 128]
    tile_k: [32, 64, 128, 256]
    group_m: [1, 4, 8]
    stages: *stages
    warps: *warps

  # Wider output tiles.
  - config:
    param_map: *tile_params
    tile_m: [32, 64, 128]
    tile_n: [256]
    tile_k: [64, 128, 256]
    group_m: [1, 4, 8]
    stages: *stages
    warps: *warps

  # Taller output tiles.
  - config:
    param_map: *tile_params
    tile_m: [256]
    tile_n: [32, 64, 128]
    tile_k: [64, 128, 256]
    group_m: [1, 4, 8]
    stages: *stages
    warps: *warps

  # Thin tiles spanning a large output dimension.
  - config:
    param_map: *tile_params
    tile_m: [64]
    tile_n: [512]
    tile_k: [64, 128]
    group_m: [1]
    stages: *stages
    warps: *warps

  # Tall tiles spanning a small output width.
  - config:
    param_map: *tile_params
    tile_m: [512]
    tile_n: [32, 64]
    tile_k: [64, 128]
    group_m: [1]
    stages: *stages
    warps: *warps

  # Long K with compact output.
  - config:
    param_map: *tile_params
    tile_m: [16, 32]
    tile_n: [64]
    tile_k: [512, 1024]
    group_m: [1]
    stages: *stages
    warps: *warps

  # Long K with regular output.
  - config:
    param_map: *tile_params
    tile_m: [64, 128]
    tile_n: [128]
    tile_k: [512]
    group_m: [1]
    stages: *stages
    warps: *warps

  # Two-row-group ordering.
  - config:
    param_map: *tile_params
    tile_m: [32]
    tile_n: [64]
    tile_k: [256]
    group_m: [2]
    stages: *stages
    warps: *warps

  - strategy: {M: default, N: default, K: default, BATCH: default, DOT_PAD_ONLY_K: default, BIAS_IS_VECTOR: default, bias_batch_stride: default, bias_M_stride: default, bias_N_stride: default}
