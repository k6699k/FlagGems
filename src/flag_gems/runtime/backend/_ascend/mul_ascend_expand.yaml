mul:
  - config:
    param_map:
      META:
        BLOCK_SIZE: block_size
      num_stages: stages
      num_warps: warps
    block_size: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
    stages: [1, 3]
    warps: [4]
  - strategy:
      n_elements: align32
      dtype: default

mul_broadcast_tiled:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
      num_stages: stages
      num_warps: warps
    block_m: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
    block_n: [32, 64, 128, 256, 512, 1024, 2048, 4096]
    stages: [1, 3]
    warps: [4]
  - strategy:
      M: default
      N: default
      dtype: default
      a_s0: default
      a_s1: default
      b_s0: default
      b_s1: default
