mv_mthreads:
  # Few output rows. Cover the measured 512/1024-element reduction tiles
  # with smaller CTA sizes to expose parallelism.
  - config:
    param_map: &mv_params
      META: {BLOCK_N: block_n, BLOCK_M: block_m}
      num_stages: stages
      num_warps: warps
    block_n: [1, 2, 4]
    block_m: [256, 512, 1024]
    stages: [2, 4]
    warps: [2, 4]
  - config:
    param_map: *mv_params
    block_n: [1, 2, 4]
    block_m: [512]
    stages: [3]
    warps: [2, 4]
  # Single-row fallbacks for short and unaligned reductions.
  - config:
    param_map: *mv_params
    block_n: [1]
    block_m: [64, 128, 256, 512]
    stages: [4]
    warps: [8]
  # More output rows per CTA, without growing both tile dimensions at once.
  - config:
    param_map: *mv_params
    block_n: [8, 16]
    block_m: [64, 128, 256, 512]
    stages: [3, 4]
    warps: [4, 8]
  - config:
    param_map: *mv_params
    block_n: [32, 64]
    block_m: [64, 128, 256]
    stages: [3, 4]
    warps: [8]
  - config:
    param_map: *mv_params
    block_n: [32]
    block_m: [128, 256]
    stages: [3, 4]
    warps: [4]
