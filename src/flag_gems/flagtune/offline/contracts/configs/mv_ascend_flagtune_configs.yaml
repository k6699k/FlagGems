schema_version: 3
op_id: flaggems/mv
pretune:
  shape:
    fields:
      M: {type: int, min: 1}
      N: {type: int, min: 1}
      A_layout:
        type: str
        default: {literal: contiguous}
        choices: [contiguous, transposed_2d]
      Count: {type: int, required: false, min: 0, role: count}
    identity: [M, N, A_layout]
  dispatch: {policy: first_match, order: [gemv]}
  benchmark:
    tensors:
      a: {factory: randn, shape: [N, M], dtype: runtime, layout: A_layout}
      b: {factory: randn, shape: [M], dtype: runtime}
    invoke: {kind: flag_gems_public, args: [a, b]}
variants:
  gemv:
    inputs:
      M: {min: 1}
      N: {min: 1}
      stride_an: {default: 0, min: 0}
      stride_am: {default: 1, min: 0}
      stride_bm: {default: 1, min: 0}
      stride_cn: {default: 1, min: 0}
    when: {op: gt, args: [M, 0]}
    params:
      BLOCK_M: {values: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]}
      BLOCK_N: {values: [1, 2, 4, 8, 16, 32, 64, 128]}
      num_stages: {values: [1, 2, 3]}
      num_warps: {values: [4]}
    features:
      - {name: M, op: ident, args: [M]}
      - {name: N, op: ident, args: [N]}
      - {name: stride_an, op: ident, args: [stride_an]}
      - {name: stride_am, op: ident, args: [stride_am]}
      - {name: stride_bm, op: ident, args: [stride_bm]}
      - {name: stride_cn, op: ident, args: [stride_cn]}
      - {name: reduction_contiguous, op: eq, args: [stride_am, 1]}
      - {name: rows_contiguous, op: eq, args: [stride_an, 1]}
      - {name: reduction_stride_span, op: mul, args: [stride_am, BLOCK_M]}
      - {name: row_stride_span, op: mul, args: [stride_an, BLOCK_N]}
      - {name: BLOCK_M, op: ident, args: [BLOCK_M]}
      - {name: BLOCK_N, op: ident, args: [BLOCK_N]}
      - {name: num_stages, op: ident, args: [num_stages]}
      - {name: num_warps, op: ident, args: [num_warps]}
      - {name: log2_m, op: log2, args: [M]}
      - {name: log2_n, op: log2, args: [N]}
      - {name: programs, op: cdiv, args: [N, BLOCK_N]}
      - {name: iterations, op: cdiv, args: [M, BLOCK_M]}
      - {name: tile_elements, op: mul, args: [BLOCK_M, BLOCK_N]}
      - {name: tail_m, op: mod, args: [M, BLOCK_M]}
      - {name: tail_n, op: mod, args: [N, BLOCK_N]}
