schema_version: 3
op_id: flaggems/mul

pretune:
  shape:
    fields:
      kind: {type: str, choices: [broadcast]}
      lhs_shape: {type: shape}
      rhs_shape: {type: shape}
      Count: {type: int, required: false, min: 0, role: count}
      n_elements:
        type: int
        min: 1
        default: {op: broadcast_numel, args: [lhs_shape, rhs_shape]}
      n_cols:
        type: int
        min: 1
        default: {op: broadcast_last_dim, args: [lhs_shape, rhs_shape]}
      M: {type: int, min: 1, default: {op: cdiv, args: [n_elements, n_cols]}}
      N: {type: int, min: 1, default: n_cols}
    identity: [kind, lhs_shape, rhs_shape]
  dispatch:
    policy: first_match
    order: [broadcast_tiled]
  benchmark:
    tensors:
      lhs: {factory: randn, shape: lhs_shape, dtype: runtime}
      rhs: {factory: randn, shape: rhs_shape, dtype: runtime}
    invoke:
      kind: flag_gems_public
      args: [lhs, rhs]

variants:
  broadcast_tiled:
    inputs:
      M: {min: 1}
      N: {min: 1}
      a_s0: {default: 1}
      a_s1: {default: 0}
      b_s0: {default: N}
      b_s1: {default: 1}
    when: {op: gt, args: [M, 0]}
    params:
      BLOCK_M: {values: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]}
      BLOCK_N: {values: [32, 64, 128, 256, 512, 1024, 2048, 4096]}
      num_stages: {values: [1, 3]}
      num_warps: {values: [4]}
    features:
      - {name: M, op: ident, args: [M]}
      - {name: N, op: ident, args: [N]}
      - {name: a_s0, op: ident, args: [a_s0]}
      - {name: a_s1, op: ident, args: [a_s1]}
      - {name: b_s0, op: ident, args: [b_s0]}
      - {name: b_s1, op: ident, args: [b_s1]}
      - {name: BLOCK_M, op: ident, args: [BLOCK_M]}
      - {name: BLOCK_N, op: ident, args: [BLOCK_N]}
      - {name: num_stages, op: ident, args: [num_stages]}
      - {name: num_warps, op: ident, args: [num_warps]}
      - {name: log2_M, op: log2, args: [M]}
      - {name: log2_N, op: log2, args: [N]}
      - {name: log2_BLOCK_M, op: log2, args: [BLOCK_M]}
      - {name: log2_BLOCK_N, op: log2, args: [BLOCK_N]}
      - {name: grid_m, op: cdiv, args: [M, BLOCK_M]}
      - {name: grid_n, op: cdiv, args: [N, BLOCK_N]}
      - {name: grid_size, op: mul, args: [grid_m, grid_n]}
      - {name: tile_elements, op: mul, args: [BLOCK_M, BLOCK_N]}
      - {name: tail_m, op: mod, args: [M, BLOCK_M]}
      - {name: tail_n, op: mod, args: [N, BLOCK_N]}
      - {name: block_to_m, op: fdiv, args: [BLOCK_M, M]}
      - {name: block_to_n, op: fdiv, args: [BLOCK_N, N]}
      - {name: a_row_broadcast, op: eq, args: [a_s1, 0]}
      - {name: b_row_broadcast, op: eq, args: [b_s1, 0]}
      - {name: a_column_broadcast, op: eq, args: [a_s0, 0]}
      - {name: b_column_broadcast, op: eq, args: [b_s0, 0]}
