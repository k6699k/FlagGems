schema_version: 3
op_id: flaggems/baddbmm

pretune:
  shape:
    fields:
      BATCH: {type: int, min: 1, aliases: [B]}
      M: {type: int, min: 1}
      N: {type: int, min: 1}
      K: {type: int, min: 1}
      B_layout:
        type: str
        default: {literal: contiguous}
        choices: [contiguous, transposed_last2]
      Count: {type: int, required: false, min: 0, role: count}
    identity: [BATCH, M, N, K, B_layout]
  dispatch:
    policy: first_match
    order: [batched_gemm, tiled_gemm, narrow_gemv, direct_nt_tiled, column_gemv]
  benchmark:
    tensors:
      bias: {factory: randn, shape: [BATCH, M, N], dtype: runtime}
      a: {factory: randn, shape: [BATCH, M, K], dtype: runtime}
      b: {factory: randn, shape: [BATCH, K, N], dtype: runtime, layout: B_layout}
    invoke:
      kind: flag_gems_public
      args: [bias, a, b]

variants:
  batched_gemm:
    inputs:
      BATCH: {min: 1}
      M: {min: 1}
      N: {min: 1}
      K: {min: 1}
      DOT_PAD_ONLY_K: {default: 0, min: 0, max: 1}
      BIAS_IS_VECTOR: {default: 1, min: 0, max: 1}
      bias_batch_stride: {default: 0, min: 0}
      bias_M_stride: {default: 0, min: 0}
      bias_N_stride: {default: 1, min: 0}
    when: {op: gt, args: [BATCH, 0]}
    params:
      # The runtime supplies the grouped candidate domain to the proposer.
      TILE_M: {values: [16, 32, 64, 128, 256, 512, 1024]}
      TILE_N: {values: [32, 64, 128, 256, 512, 1024]}
      TILE_K: {values: [32, 64, 128, 256, 512, 1024]}
      GROUP_M: {values: [1, 2, 4, 8]}
      num_stages: {values: [1, 2, 3]}
      num_warps: {values: [4]}
    features:
      - {name: BATCH, op: ident, args: [BATCH]}
      - {name: M, op: ident, args: [M]}
      - {name: N, op: ident, args: [N]}
      - {name: K, op: ident, args: [K]}
      - {name: DOT_PAD_ONLY_K, op: ident, args: [DOT_PAD_ONLY_K]}
      - {name: BIAS_IS_VECTOR, op: ident, args: [BIAS_IS_VECTOR]}
      - {name: bias_batch_stride, op: ident, args: [bias_batch_stride]}
      - {name: bias_M_stride, op: ident, args: [bias_M_stride]}
      - {name: bias_N_stride, op: ident, args: [bias_N_stride]}
      - {name: TILE_M, op: ident, args: [TILE_M]}
      - {name: TILE_N, op: ident, args: [TILE_N]}
      - {name: TILE_K, op: ident, args: [TILE_K]}
      - {name: GROUP_M, op: ident, args: [GROUP_M]}
      - {name: num_stages, op: ident, args: [num_stages]}
      - {name: num_warps, op: ident, args: [num_warps]}
      - {name: log2_batch, op: log2, args: [BATCH]}
      - {name: log2_m, op: log2, args: [M]}
      - {name: log2_n, op: log2, args: [N]}
      - {name: log2_k, op: log2, args: [K]}
      - {name: log2_tile_m, op: log2, args: [TILE_M]}
      - {name: log2_tile_n, op: log2, args: [TILE_N]}
      - {name: log2_tile_k, op: log2, args: [TILE_K]}
      - {name: grid_m, op: cdiv, args: [M, TILE_M]}
      - {name: grid_n, op: cdiv, args: [N, TILE_N]}
      - {name: grid_per_batch, op: mul, args: [grid_m, grid_n]}
      - {name: grid_size, op: mul, args: [BATCH, grid_per_batch]}
      - {name: k_iterations, op: cdiv, args: [K, TILE_K]}
      - {name: a_tile_elements, op: mul, args: [TILE_M, TILE_K]}
      - {name: b_tile_elements, op: mul, args: [TILE_K, TILE_N]}
      - {name: c_tile_elements, op: mul, args: [TILE_M, TILE_N]}
      - {name: tail_m, op: mod, args: [M, TILE_M]}
      - {name: tail_n, op: mod, args: [N, TILE_N]}
      - {name: tail_k, op: mod, args: [K, TILE_K]}
      - {name: tile_to_m, op: fdiv, args: [TILE_M, M]}
      - {name: tile_to_n, op: fdiv, args: [TILE_N, N]}
      - {name: tile_to_k, op: fdiv, args: [TILE_K, K]}
  tiled_gemm: &tiled_gemm
    inputs:
      BATCH: {default: 1, min: 1}
      M: {min: 1}
      N: {min: 1}
      K: {min: 1}
      TRANSPOSED: {default: 0, min: 0, max: 1}
      WITH_BIAS: {default: 0, min: 0, max: 1}
      HINT: {default: 0, min: 0, max: 1}
    when: {op: gt, args: [M, 0]}
    params:
      BM: {values: [16, 32, 64, 128, 256]}
      BN: {values: [16, 32, 64, 128, 256, 512]}
      BK: {values: [64, 128, 256, 512]}
      num_stages: {values: [1, 2]}
      num_warps: {values: [4]}
    features:
      - {name: BATCH, op: ident, args: [BATCH]}
      - {name: M, op: ident, args: [M]}
      - {name: N, op: ident, args: [N]}
      - {name: K, op: ident, args: [K]}
      - {name: TRANSPOSED, op: ident, args: [TRANSPOSED]}
      - {name: WITH_BIAS, op: ident, args: [WITH_BIAS]}
      - {name: HINT, op: ident, args: [HINT]}
      - {name: BM, op: ident, args: [BM]}
      - {name: BN, op: ident, args: [BN]}
      - {name: BK, op: ident, args: [BK]}
      - {name: num_stages, op: ident, args: [num_stages]}
      - {name: num_warps, op: ident, args: [num_warps]}
      - {name: grid_m, op: cdiv, args: [M, BM]}
      - {name: grid_n, op: cdiv, args: [N, BN]}
      - {name: k_iterations, op: cdiv, args: [K, BK]}
      - {name: output_tile, op: mul, args: [BM, BN]}
  narrow_gemv:
    inputs:
      M: {min: 1}
      K: {min: 1}
      BATCH: {min: 1}
      WITH_BIAS: {min: 0, max: 1, default: 1}
    when: {op: gt, args: [M, 0]}
    params:
      BM: {values: [1, 2, 4, 8]}
      BK: {values: [64, 128, 256, 512, 1024]}
      num_stages: {values: [1]}
      num_warps: {values: [4]}
    features:
      - {name: M, op: ident, args: [M]}
      - {name: K, op: ident, args: [K]}
      - {name: BATCH, op: ident, args: [BATCH]}
      - {name: WITH_BIAS, op: ident, args: [WITH_BIAS]}
      - {name: BM, op: ident, args: [BM]}
      - {name: BK, op: ident, args: [BK]}
      - {name: num_stages, op: ident, args: [num_stages]}
      - {name: num_warps, op: ident, args: [num_warps]}
      - {name: grid_m, op: cdiv, args: [M, BM]}
      - {name: k_iterations, op: cdiv, args: [K, BK]}
      - {name: a_tile, op: mul, args: [BM, BK]}

  direct_nt_tiled: *tiled_gemm
  column_gemv:
    inputs:
      M: {min: 1}
      K: {min: 1}
      BATCH: {min: 1}
      WITH_BIAS: {min: 0, max: 1, default: 1}
    when: {op: gt, args: [M, 0]}
    params:
      BM: {values: [1, 2, 4, 8, 16, 32]}
      BK: {values: [128, 256, 512, 1024, 2048]}
      num_stages: {values: [1]}
      num_warps: {values: [4]}
    features:
      - {name: M, op: ident, args: [M]}
      - {name: K, op: ident, args: [K]}
      - {name: BATCH, op: ident, args: [BATCH]}
      - {name: WITH_BIAS, op: ident, args: [WITH_BIAS]}
      - {name: BM, op: ident, args: [BM]}
      - {name: BK, op: ident, args: [BK]}
      - {name: num_stages, op: ident, args: [num_stages]}
      - {name: num_warps, op: ident, args: [num_warps]}
      - {name: grid_m, op: cdiv, args: [M, BM]}
      - {name: k_iterations, op: cdiv, args: [K, BK]}
      - {name: a_tile, op: mul, args: [BM, BK]}
